<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una carta para ti mi amorchito :3💌</title>
<style>
  :root{--c1:#38bdf8;--c2:#a78bfa;--c3:#f472b6;--c4:#fb923c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:#fff;overflow:hidden;
    background:radial-gradient(1000px 700px at 15% 10%,#2a1250,transparent 60%),
               radial-gradient(900px 600px at 90% 95%,#12305a,transparent 60%),
               linear-gradient(160deg,#0b0f2a,#1a1040);
    background-attachment:fixed;
  }
  #fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  main{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:20px;text-align:center}

  .hint{
    margin-top:46px;font-size:1.05rem;opacity:.9;letter-spacing:.04em;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.4;transform:scale(.97)}}
  h1{
    font-size:clamp(1.6rem,6vw,2.4rem);margin-bottom:46px;
    background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:flow 6s linear infinite;
  }
  @keyframes flow{to{background-position:300% 0}}

  /* ---------- Sobre ---------- */
  .scene{perspective:900px}
  .envelope{
    position:relative;width:min(300px,78vw);aspect-ratio:3/2;cursor:pointer;
    filter:drop-shadow(0 18px 40px rgba(167,139,250,.55));
    animation:bob 3.2s ease-in-out infinite;transition:transform .4s;
  }
  .envelope:hover{transform:scale(1.04)}
  @keyframes bob{50%{translate:0 -10px}}
  .env-back{position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,#5b4bd6,#8b5cf6)}
  .env-letter{
    position:absolute;left:8%;right:8%;top:8%;height:80%;border-radius:6px;
    background:linear-gradient(#fff,#f3e8ff);z-index:2;transition:transform .8s ease .35s;
  }
  .env-pocket{
    position:absolute;inset:0;z-index:3;border-radius:10px;
    background:linear-gradient(135deg,#7c6cf0,#b36cf2 60%,#f472b6);
    clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);
  }
  .env-flap{
    position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:top;
    background:linear-gradient(160deg,#a78bfa,#f472b6);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transition:transform .6s ease,z-index 0s .3s;
  }
  .env-heart{position:absolute;left:50%;top:44%;translate:-50% -50%;font-size:2rem;z-index:5;transition:opacity .3s;animation:beat 1.2s infinite}
  @keyframes beat{50%{scale:1.25}}
  .envelope.open{animation:none}
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
  .envelope.open .env-letter{transform:translateY(-55%)}
  .envelope.open .env-heart{opacity:0}

  /* ---------- Carta abierta ---------- */
  #paper{
    position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:18px;
    background:rgba(5,6,20,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  #paper.show{display:grid;animation:fade .4s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    width:min(480px,100%);max-height:94vh;overflow:auto;border-radius:18px;padding:22px 22px 26px;
    background:linear-gradient(170deg,#fffdf8,#f6ecff);color:#2b2140;text-align:left;
    box-shadow:0 0 70px rgba(167,139,250,.55),0 30px 60px rgba(0,0,0,.5);
    animation:rise .7s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes rise{from{opacity:0;transform:translateY(60px) scale(.9)}to{opacity:1;transform:none}}
  .sheet .to{font-weight:700;font-size:1.25rem;margin-bottom:12px;color:#6d28d9}
  .sheet .photo{
    width:100%;max-height:42vh;object-fit:cover;border-radius:12px;margin-bottom:16px;
    box-shadow:0 8px 24px rgba(109,40,217,.3);border:4px solid #fff;
  }
  .sheet .msg{line-height:1.8;white-space:pre-line;min-height:4em}
  .sheet .sign{margin-top:16px;text-align:right;font-style:italic;font-weight:600;color:#be185d;opacity:0;transition:opacity 1s}
  .sheet .sign.show{opacity:1}
  .close{
    display:block;margin:18px auto 0;font:inherit;font-weight:600;color:#fff;border:0;cursor:pointer;
    padding:11px 24px;border-radius:99px;background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3));
    box-shadow:0 6px 20px rgba(167,139,250,.5);transition:transform .2s;
  }
  .close:hover{transform:scale(1.05)}

  .heart{position:fixed;z-index:20;pointer-events:none;font-size:20px;animation:burst 1.4s ease-out forwards}
  @keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(1.6) rotate(var(--rot));opacity:0}}
  #musicBtn{position:fixed;right:14px;top:14px;z-index:30;width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:20px;cursor:pointer;display:none}
</style>
</head>
<body>

<canvas id="fx"></canvas>
<button id="musicBtn" title="Música">🎵</button>
<audio id="music" loop></audio>

<main>
  <div>
    <h1 id="titulo"></h1>
    <div class="scene">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="env-letter"></div>
        <div class="env-pocket"></div>
        <div class="env-flap"></div>
        <div class="env-heart">💙</div>
      </div>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</main>

<div id="paper">
  <div class="sheet">
    <div class="to" id="para"></div>
    <img class="photo" id="foto" alt="">
    <div class="msg" id="mensaje"></div>
    <div class="sign" id="firma"></div>
    <button class="close" id="cerrar">Cerrar 💌</button>
  </div>
</div>

<script>
/* =====================================================================
   ✏️  ZONA EDITABLE — cambia aquí todo lo que quieras
   ---------------------------------------------------------------------
   FOTO: sube tu imagen a la misma carpeta que este archivo
   (o a una carpeta "fotos/") y escribe su ruta, ej: "fotos/nosotros.jpg"
   Si la foto no existe, se muestra una imagen de relleno.
   ===================================================================== */
const CONFIG = {
  titulo:      "Tengo algo para ti 💙",
  textoSobre:  "Toca el sobre para abrirlo",

  para:        "Para mi amorcito,",
  foto:        "nosotros.jpeg",

  mensaje:
`Mi amor, no sé como expresar lo que siento, nunca me enseñaron a mostrar mis sentimientos, por eso hay veces que parezco indiferente, pero no es asi.
Tu me haces sentir cosas que nunca imagine sentir antes, el amor que siento por ti es maravilloso y me motiva a seguir adelante.

Contigo todo se siente más tranquilo, más bonito y más real.
Gracias por tu paciencia, por tus abrazos, por hacerme reír  incluso en los días difíciles y sobre todo por tu amor :3.

Quiero seguir cada dia junto a ti hoy y siempre, juntos y felices.
Te amo mucho mi amorcito dormiloncito.`,

  firma:       "— Larry y Rocky 💙",

  /* Música opcional: ruta a un mp3, ej. "musica/cancion.mp3". "" = sin música */
  musica:      ""
};
/* ===================== FIN DE LA ZONA EDITABLE ===================== */


const $ = id => document.getElementById(id);
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'>
     <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
       <stop offset='0' stop-color='#38bdf8'/><stop offset='.5' stop-color='#a78bfa'/><stop offset='1' stop-color='#f472b6'/>
     </linearGradient></defs>
     <rect width='800' height='600' fill='url(#g)'/>
     <text x='400' y='340' font-size='180' text-anchor='middle'>💙</text>
     <text x='400' y='460' font-size='38' fill='white' text-anchor='middle' font-family='sans-serif'>Pon tu foto aquí</text>
   </svg>`);

/* ---------- Textos ---------- */
$("titulo").textContent  = CONFIG.titulo;
$("hint").textContent    = CONFIG.textoSobre;
$("para").textContent    = CONFIG.para;
$("firma").textContent   = CONFIG.firma;
$("foto").onerror = function(){ this.onerror = null; this.src = PLACEHOLDER; };
$("foto").src = CONFIG.foto;

/* ---------- Fondo: estrellas de colores, cometas y chispas ---------- */
(function fx(){
  const cv = $("fx"), ctx = cv.getContext("2d");
  let W, H, dpr, stars = [];
  const comets = [], sparks = [];
  let hue = 200;

  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    stars = Array.from({length: 90}, () => ({
      x: Math.random()*W, y: Math.random()*H, r: (0.5+Math.random()*1.6)*dpr,
      h: [195,265,330,25][Math.floor(Math.random()*4)], p: Math.random()*6.28, s: .01+Math.random()*.03
    }));
  }
  resize(); addEventListener("resize", resize);

  function spawnComet(){
    const left = Math.random() < .5, speed = (2.2 + Math.random()*2.2) * dpr;
    const a = Math.random()*0.6 + 0.15;
    comets.push({ x: left ? -20 : W+20, y: Math.random()*H*.7,
      vx: Math.cos(a)*speed*(left?1:-1), vy: Math.sin(a)*speed,
      hue: (hue += 53) % 360, r: (2+Math.random()*2)*dpr });
  }
  setInterval(spawnComet, 1100); spawnComet();

  addEventListener("pointermove", e => {
    for (let i = 0; i < 2; i++){
      hue = (hue + 6) % 360;
      sparks.push({ x:e.clientX*dpr, y:e.clientY*dpr, vx:(Math.random()-.5)*dpr, vy:(Math.random()-.5)*dpr,
        life:1, hue, r:(2+Math.random()*3)*dpr });
    }
  });

  function frame(){
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    for (const s of stars){
      s.p += s.s;
      const a = 0.35 + 0.55 * Math.abs(Math.sin(s.p));
      ctx.fillStyle = `hsla(${s.h},100%,75%,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(0.1, s.r), 0, 7); ctx.fill();
    }
    /* Cometas con estela (se guardan los últimos puntos) */
    for (let i = comets.length - 1; i >= 0; i--){
      const c = comets[i];
      c.trail = c.trail || [];
      c.trail.push([c.x, c.y]); if (c.trail.length > 28) c.trail.shift();
      c.x += c.vx; c.y += c.vy; c.hue = (c.hue + .5) % 360;
      for (let k = 0; k < c.trail.length; k++){
        const t = k / c.trail.length;
        ctx.fillStyle = `hsla(${c.hue},100%,65%,${t*.6})`;
        ctx.beginPath(); ctx.arc(c.trail[k][0], c.trail[k][1], Math.max(0.1, c.r*t), 0, 7); ctx.fill();
      }
      ctx.fillStyle = `hsl(${c.hue},100%,80%)`;
      ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(0.1, c.r), 0, 7); ctx.fill();
      if (c.x < -80 || c.x > W+80 || c.y > H+80) comets.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.life -= 0.025;
      if (s.life <= 0){ sparks.splice(i, 1); continue; }
      ctx.fillStyle = `hsla(${s.hue},100%,70%,${s.life})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(0.1, s.r*s.life), 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ---------- Corazones ---------- */
function burst(x, y, n = 14){
  const em = ["💙","💜","💖","✨","💫","🧡"];
  for (let i = 0; i < n; i++){
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = em[Math.floor(Math.random()*em.length)];
    h.style.left = x + "px"; h.style.top = y + "px";
    h.style.setProperty("--dx", (Math.random()*260 - 130) + "px");
    h.style.setProperty("--dy", (-Math.random()*220 - 40) + "px");
    h.style.setProperty("--rot", (Math.random()*120 - 60) + "deg");
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1500);
  }
}

/* ---------- Música ---------- */
const music = $("music"), musicBtn = $("musicBtn");
if (CONFIG.musica){
  music.src = CONFIG.musica; musicBtn.style.display = "block";
  musicBtn.onclick = () => {
    if (music.paused){ music.play(); musicBtn.textContent = "🎵"; }
    else { music.pause(); musicBtn.textContent = "🔇"; }
  };
}

/* ---------- Abrir / cerrar la carta ---------- */
let typing = null;
function typeText(el, text, done){
  el.textContent = ""; let i = 0;
  clearTimeout(typing);
  (function step(){
    el.textContent = text.slice(0, ++i);
    if (i < text.length) typing = setTimeout(step, 35); else if (done) done();
  })();
}

$("envelope").onclick = e => {
  const env = $("envelope");
  if (env.classList.contains("open")) return;
  env.classList.add("open");
  burst(e.clientX, e.clientY, 10);
  if (CONFIG.musica) music.play().catch(() => {});
  setTimeout(() => {
    $("paper").classList.add("show");
    $("firma").classList.remove("show");
    typeText($("mensaje"), CONFIG.mensaje, () => {
      $("firma").classList.add("show");
      burst(innerWidth/2, innerHeight*.6, 18);
    });
  }, 1300);
};

$("cerrar").onclick = () => {
  clearTimeout(typing);
  $("paper").classList.remove("show");
  $("envelope").classList.remove("open");
};
</script>
</body>
</html>
